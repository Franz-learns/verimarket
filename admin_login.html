<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — VeriMarket</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .auth-wrap{max-width:400px; margin:120px auto; padding:0 24px;}
  .auth-card{background:var(--card); border:1px solid #EEF2F7; border-radius:var(--radius); padding:40px; box-shadow:var(--shadow-sm);}
  .form-group{margin-bottom:20px;}
  .form-group label{display:block; font-weight:600; font-size:14px; margin-bottom:8px;}
  .form-group input{width:100%; padding:13px 16px; border-radius:12px; border:1px solid #E2E8F0; font-family:'Inter',sans-serif; font-size:14.5px;}
  .form-group input:focus{outline:none; border-color:var(--primary);}
  .alert-error{background:rgba(239,68,68,0.08); color:#B91C1C; border:1px solid rgba(239,68,68,0.2); border-radius:14px; padding:14px 16px; font-size:14px; margin-bottom:20px;}
</style>
<link rel="stylesheet" href="css/static.css"></head>
<body><aside class="static-banner"><strong>Static HTML preview</strong><span>Original VeriMarket design · sample listings and account states · no live transactions</span><a href="backend-required.html">About this version →</a></aside>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="section-head" style="margin-bottom:28px; text-align:left;">
      <span class="eyebrow">🔐 Staff Only</span>
      <h2 style="font-size:24px;">Admin Login</h2>
    </div>
        <div class="static-form-note">Layout preview only. This action requires the PHP application.</div><form action="backend-required.html"><fieldset disabled style="border:0;padding:0;margin:0;min-width:0;">
            <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Log In</button>
    </fieldset></form>
  </div>
</div>
<script src="js/main.js"></script><script src="js/static.js"></script></body>
</html>
